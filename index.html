<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyFlow - Dashboard & Academic Overview</title>
    <meta name="description" content="Personal Daily Study & Skill Tracker. Master your subjects, monitor exam countdowns, build skills, and track focus sessions with direct client-side Google Drive integration." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <style id="custom-theme-variables">
      :root {
        --mesh-blob-1: rgba(16, 185, 129, 0.16);
        --mesh-blob-2: rgba(99, 102, 241, 0.16);
        --mesh-blob-3: rgba(56, 189, 248, 0.14);
      }
      [data-theme="mocha-lavender"] {
        --bg-app: #1A130E;
        --bg-sidebar: #241A13;
        --bg-card: #2B1E16;
        --border-glow: #422D21;
        --primary: #6F4E37;
        --secondary: #E5E4E2;
        --accent: #E6E0F0;
        --text-main: #E5E4E2;
        --text-muted: #B3AAA4;

        bg-app: #1A130E;
        bg-sidebar: #241A13;
        bg-card: #2B1E16;
        border-glow: #422D21;
        primary: #6F4E37;
        secondary: #E5E4E2;
        accent: #E6E0F0;
        text-main: #E5E4E2;
        text-muted: #B3AAA4;

        --mesh-blob-1: rgba(111, 78, 55, 0.32);
        --mesh-blob-2: rgba(230, 224, 240, 0.22);
        --mesh-blob-3: rgba(229, 228, 226, 0.18);
      }
      [data-theme="cyber-jet"] {
        --bg-app: #0B0B0B;
        --bg-sidebar: #101010;
        --bg-card: #151515;
        --border-glow: #282828;
        --primary: #FF2DA3;
        --secondary: #D4FF3F;
        --accent: #D4FF3F;
        --text-main: #FFFFFF;
        --text-muted: #8E8E8E;

        bg-app: #0B0B0B;
        bg-sidebar: #101010;
        bg-card: #151515;
        border-glow: #282828;
        primary: #FF2DA3;
        secondary: #D4FF3F;
        accent: #D4FF3F;
        text-main: #FFFFFF;
        text-muted: #8E8E8E;

        --mesh-blob-1: rgba(255, 45, 163, 0.28);
        --mesh-blob-2: rgba(212, 255, 63, 0.22);
        --mesh-blob-3: rgba(255, 45, 163, 0.18);
      }

      /* Ambient Gradient Mesh Canvas & Blobs */
      .ambient-mesh-canvas {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .mesh-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        -webkit-filter: blur(80px);
        opacity: 0.85;
        pointer-events: none;
        will-change: transform;
        transform: translate3d(0, 0, 0);
        transition: background 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .mesh-blob.blob-1 {
        width: 580px;
        height: 580px;
        top: -140px;
        left: -90px;
        background: radial-gradient(circle, var(--mesh-blob-1) 0%, transparent 70%);
        animation: driftPrimary 24s ease-in-out infinite;
      }
      .mesh-blob.blob-2 {
        width: 680px;
        height: 680px;
        top: 25%;
        right: -160px;
        background: radial-gradient(circle, var(--mesh-blob-2) 0%, transparent 70%);
        animation: driftSecondary 28s ease-in-out infinite;
      }
      .mesh-blob.blob-3 {
        width: 520px;
        height: 520px;
        bottom: -120px;
        left: 20%;
        background: radial-gradient(circle, var(--mesh-blob-3) 0%, transparent 70%);
        animation: driftAccent 22s ease-in-out infinite;
      }
      @keyframes driftPrimary {
        0%, 100% { transform: translate3d(0px, 0px, 0px) scale(1); }
        33% { transform: translate3d(85px, -65px, 0px) scale(1.15); }
        66% { transform: translate3d(-55px, 75px, 0px) scale(0.92); }
      }
      @keyframes driftSecondary {
        0%, 100% { transform: translate3d(0px, 0px, 0px) scale(1); }
        33% { transform: translate3d(-95px, 75px, 0px) scale(1.12); }
        66% { transform: translate3d(65px, -55px, 0px) scale(0.94); }
      }
      @keyframes driftAccent {
        0%, 100% { transform: translate3d(0px, 0px, 0px) scale(1); }
        33% { transform: translate3d(75px, 85px, 0px) scale(0.88); }
        66% { transform: translate3d(-85px, -65px, 0px) scale(1.18); }
      }
      #app, #root, main, #main-content, #app-sidebar, aside, header, nav {
        position: relative;
        z-index: 1;
      }
      #main-content, main {
        flex: 1 1 0%;
        width: 100%;
        min-width: 0;
        max-width: none;
        padding: 1.5rem;
      }
      #main-layout-wrapper {
        flex: 1 1 0%;
        width: 100%;
        min-width: 0;
      }
      #app-sidebar {
        flex-shrink: 0;
      }
    </style>
    <!-- Immediate storage cleanup for legacy/expired tokens -->
    <script>
      try {
        localStorage.removeItem('google_access_token');
        localStorage.removeItem('studyflow_drive_token');
        localStorage.removeItem('google_token_expiry');
      } catch (e) {}
    </script>
    <!-- Google Identity Services (GIS) for direct client-side Google Drive integration -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" async defer></script>
  </head>
  <body class="bg-theme-bg text-theme-text font-sans antialiased transition-colors duration-200">
    <div class="ambient-mesh-canvas" aria-hidden="true">
      <div class="mesh-blob blob-1"></div>
      <div class="mesh-blob blob-2"></div>
      <div class="mesh-blob blob-3"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/pages/dashboard.jsx"></script>
  </body>
</html>
