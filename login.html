<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Study Tracker</title>
    <meta name="description" content="Sign in with your Google account to access Study Tracker and securely synchronize your study notes directly to your personal Google Drive." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <!-- Immediate auth check: redirect to index.html if persistent genuine session exists -->
    <script>
      try {
        const params = new URLSearchParams(window.location.search);
        const isExpired = params.get('expired') === 'true';
        const isDemo = sessionStorage.getItem('is_demo_user') === 'true' || localStorage.getItem('is_demo_user') === 'true';
        const demoEnd = Number(sessionStorage.getItem('demo_session_end') || localStorage.getItem('demo_session_end') || 0);

        // Purge any cached/expired access tokens in localStorage to prevent reusing old sensitive scopes
        localStorage.removeItem('google_access_token');
        localStorage.removeItem('studyflow_drive_token');
        localStorage.removeItem('google_token_expiry');
        localStorage.removeItem('google_granted_scopes');

        if (isExpired || (isDemo && Date.now() >= demoEnd)) {
          // Purge expired demo session keys immediately
          sessionStorage.removeItem('is_demo_user');
          sessionStorage.removeItem('demo_session_end');
          localStorage.removeItem('is_demo_user');
          localStorage.removeItem('demo_session_end');
          document.cookie = 'study_session=; max-age=0; path=/;';
        } else {
          const hasCookie = document.cookie.includes('study_session=');
          const hasProfile = localStorage.getItem('user_profile') || localStorage.getItem('google_user_profile');
          if (hasCookie || hasProfile) {
            window.location.replace('/index.html');
          }
        }
      } catch (e) {}
    </script>
    <!-- Global Admin Auth Configuration -->
    <script src="admin-config.js"></script>
    <!-- Google Identity Services (GIS) Client SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-theme-bg text-theme-text font-sans antialiased transition-colors duration-200 min-h-screen flex flex-col justify-center">
    <div id="root"></div>
    <script type="module" src="/src/pages/login.jsx"></script>
  </body>
</html>
